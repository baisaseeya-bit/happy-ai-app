<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy AI</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d4af37">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f111e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            height: 4px;
            width: 100%;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: #141728;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            flex-wrap: wrap;
            gap: 8px;
        }
        .app-title {
            font-size: 1.1rem;
            font-weight: bold;
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .lang-select {
            background: #1f2440;
            color: #ffd700;
            border: 1px solid rgba(212, 175, 55, 0.5);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            outline: none;
            cursor: pointer;
        }
        .vip-btn {
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            color: #0f111e;
            border: none;
            padding: 5px 10px;
            border-radius: 16px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
        }
        .chat-container {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .ai-message {
            background: #1a1e36;
            border: 1px solid rgba(212, 175, 55, 0.4);
            align-self: flex-start;
            border-top-left-radius: 2px;
        }
        .user-message {
            background: linear-gradient(135deg, #d4af37, #aa771c);
            color: #0f111e;
            align-self: flex-end;
            border-top-right-radius: 2px;
            font-weight: 500;
        }
        .chat-input-area {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background: #141728;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            gap: 8px;
        }
        .plus-btn {
            background: none;
            border: none;
            color: #ffd700;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 4px;
        }
        .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: #1f2440;
            border: 1px solid rgba(212, 175, 55, 0.5);
            border-radius: 24px;
            padding: 4px 12px;
        }
        .chat-input {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            padding: 8px;
            font-size: 0.95rem;
            outline: none;
        }
        .chat-input::placeholder {
            color: #8b92b2;
        }
        .send-btn {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none;
            color: #0f111e;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .mic-btn {
            background: none;
            border: none;
            color: #ffd700;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 4px;
        }
        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: #141728;
            border: 2px solid #d4af37;
            padding: 24px;
            border-radius: 16px;
            width: 85%;
            max-width: 320px;
            text-align: center;
        }
        .modal-box h3 {
            color: #ffd700;
            margin-bottom: 12px;
        }
        .modal-input {
            width: 100%;
            padding: 10px;
            background: #1f2440;
            border: 1px solid #d4af37;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            margin-bottom: 16px;
            text-align: center;
            outline: none;
        }
        .modal-btns {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .modal-btn-primary {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none;
            color: #0f111e;
            padding: 8px 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
        }
        .modal-btn-secondary {
            background: transparent;
            border: 1px solid #8b92b2;
            color: #8b92b2;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header></header>
    
    <div class="navbar">
        <div class="app-title" id="appTitle">✨ Happy AI 👑</div>
        <div class="nav-right">
            <select class="lang-select" id="langSelect" onchange="changeLanguage()">
                <option value="hi">हिंदी</option>
                <option value="en">English</option>
                <option value="mr">मराठी</option>
                <option value="ta">தமிழ்</option>
            </select>
            <button class="vip-btn" id="vipBtnText" onclick="openVipModal()">👑 VIP / Upgrade</button>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message ai-message" id="welcomeMsg">
            नमस्ते! मैं Happy AI हूँ। आप अपनी पसंद की कोई भी फोटो या वीडियो बनवा सकती हैं! ✨<br>आप रोज़ाना 3 फ्री जनरेशन पा सकती हैं! 🎨
        </div>
    </div>

    <div class="chat-input-area">
        <button class="plus-btn" onclick="openMenu()">+</button>
        <div class="input-wrapper">
            <input type="text" id="userInput" class="chat-input" placeholder="Ask Happy AI...">
            <button class="send-btn" id="sendBtn">➤</button>
        </div>
        <button class="mic-btn" onclick="startVoiceInput()">🎙️</button>
    </div>

    <!-- Secure VIP Password Modal -->
    <div class="modal-overlay" id="vipModal">
        <div class="modal-box">
            <h3 id="modalTitle">VIP पासकोड दर्ज करें</h3>
            <input type="password" id="vipPassInput" class="modal-input" placeholder="••••">
            <div class="modal-btns">
                <button class="modal-btn-secondary" id="cancelBtn" onclick="closeVipModal()">रद्द करें</button>
                <button class="modal-btn-primary" id="verifyBtn" onclick="verifyVip()">सत्यापित करें</button>
            </div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        let freeGenerations = 3;

        const translations = {
            hi: {
                title: "✨ Happy AI 👑",
                vipBtn: "👑 VIP / Upgrade",
                welcome: "नमस्ते! मैं Happy AI हूँ। आप अपनी पसंद की कोई भी फोटो या वीडियो बनवा सकती हैं! ✨<br>आप रोज़ाना 3 फ्री जनरेशन पा सकती हैं! 🎨",
                placeholder: "यहाँ अपना प्रॉम्प्ट लिखें...",
                modalTitle: "VIP पासकोड दर्ज करें",
                cancel: "रद्द करें",
                verify: "सत्यापित करें",
                success: "🎉 बधाई हो! VIP मेंबरशिप सक्रिय हो गई है। अब अनलिमिटेड जनरेशन का आनंद लें!",
                wrong: "❌ गलत पासकोड! कृपया सही कोड दर्ज करें।",
                limitOver: "⚠️ आपके 3 फ्री जनरेशन पूरे हो गए हैं!<br>👑 मेंबरशिप अपग्रेड के लिए ऊपर <b>VIP / Upgrade</b> पर क्लिक करें।",
                processing: "✨ आपकी रिक्वेस्ट प्रोसेस हो रही है!<br>🎨 आपकी पसंद की इमेज/वीडियो तैयार की जा रही है... (शेष फ्री: "
            },
            en: {
                title: "✨ Happy AI 👑",
                vipBtn: "👑 VIP / Upgrade",
                welcome: "Hello! I am Happy AI. You can create any photo or video of your choice! ✨<br>You get 3 free generations daily! 🎨",
                placeholder: "Ask Happy AI or type prompt...",
                modalTitle: "Enter VIP Passcode",
                cancel: "Cancel",
                verify: "Verify",
                success: "🎉 Congratulations! VIP membership is now active. Enjoy unlimited generations!",
                wrong: "❌ Incorrect passcode! Please enter the correct code.",
                limitOver: "⚠️ Your 3 free generations are over!<br>👑 Click <b>VIP / Upgrade</b> above for membership.",
                processing: "✨ Processing your request!<br>🎨 Generating your custom image/video... (Free left: "
            },
            mr: {
                title: "✨ Happy AI 👑",
                vipBtn: "👑 VIP / Upgrade",
                welcome: "नमस्कार! मी Happy AI आहे. तुम्ही तुमच्या पसंतीचा कोणताही फोटो किंवा व्हिडिओ तयार करू शकता! ✨<br>तुम्हाला दररोज 3 फ्री जनरेशन मिळतात! 🎨",
                placeholder: "तुमचा प्रॉम्प्ट येथे लिहा...",
                modalTitle: "VIP पासकोड प्रविष्ट करा",
                cancel: "रद्द करा",
                verify: "तпаसा",
                success: "🎉 अभिनंदन! VIP मेंबरशिप सक्रिय झाली आहे.",
                wrong: "❌ चुकाचा पासकोड! कृपया योग्य कोड टाका.",
                limitOver: "⚠️ तुमची 3 फ्री जनरेशन संपली आहेत!<br>👑 मेंबरशिप अपग्रेडसाठी वर क्लिक करा.",
                processing: "✨ विनंती प्रक्रिया सुरू आहे... (उरलेले फ्री: "
            },
            ta: {
                title: "✨ Happy AI 👑",
                vipBtn: "👑 VIP / Upgrade",
                welcome: "வணக்கம்! நான் Happy AI. உங்களுக்கு பிடித்த புகைப்படங்கள் அல்லது வீடியோக்களை உருவாக்கலாம்! ✨",
                placeholder: "உங்கள் கேள்தியை இங்கே தட்டச்சு செய்யவும்...",
                modalTitle: "VIP குறியீட்டை உள்ளிடவும்",
                cancel: "ரத்து செய்",
                verify: "சரிபார்",
                success: "🎉 வாழ்த்துகள்! VIP மெம்பர்ஷிப் فعالமானது.",
                wrong: "❌ தவறான குறியீடு!",
                limitOver: "⚠️ உங்கள் 3 இலவச வரம்புகள் முடிந்துவிட்டன!",
                processing: "✨ செயலாக்கப்படுகிறது..."
            }
        };

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            const t = translations[lang];
            document.getElementById('appTitle').innerText = t.title;
            document.getElementById('vipBtnText').innerText = t.vipBtn;
            document.getElementById('welcomeMsg').innerHTML = t.welcome;
            document.getElementById('userInput').placeholder = t.placeholder;
            document.getElementById('modalTitle').innerText = t.modalTitle;
            document.getElementById('cancelBtn').innerText = t.cancel;
            document.getElementById('verifyBtn').innerText = t.verify;
        }

        function sendMessage() {
            const inputField = document.getElementById('userInput');
            const messageText = inputField.value.trim();
            if(!messageText) return;

            const lang = document.getElementById('langSelect').value;
            const t = translations[lang];
            const chatContainer = document.getElementById('chatContainer');

            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.innerText = messageText;
            chatContainer.appendChild(userDiv);

            inputField.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            setTimeout(() => {
                const aiDiv = document.createElement('div');
                aiDiv.className = 'message ai-message';
                
                if(freeGenerations > 0) {
                    freeGenerations--;
                    aiDiv.innerHTML = t.processing + freeGenerations + ")";
                } else {
                    aiDiv.innerHTML = t.limitOver;
                }
                
                chatContainer.appendChild(aiDiv);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 800);
        }

        document.getElementById('sendBtn').onclick = sendMessage;

        document.getElementById('userInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function openVipModal() {
            document.getElementById('vipPassInput').value = '';
            document.getElementById('vipModal').style.display = 'flex';
        }

        function closeVipModal() {
            document.getElementById('vipModal').style.display = 'none';
        }

        function verifyVip() {
            const lang = document.getElementById('langSelect').value;
            const t = translations[lang];
            let pass = document.getElementById('vipPassInput').value;
            
            if(pass === "7777") {
                freeGenerations = 9999;
                alert(t.success);
                closeVipModal();
            } else {
                alert(t.wrong);
            }
        }

        function startVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                const recognition = new SpeechRecognition();
                recognition.lang = document.getElementById('langSelect').value === 'en' ? 'en-US' : 'hi-IN';
                recognition.onresult = function(event) {
                    document.getElementById('userInput').value = event.results[0][0].transcript;
                };
                recognition.start();
            } else {
                alert("वॉयस इनपुट इस ब्राउज़र में उपलब्ध है।");
            }
        }

        function openMenu() {
            alert("➕ अटैचमेंट मेनू: यहाँ से आप इमेज या वीडियो मोड चुन सकती हैं।");
        }
    </script>
</body>
  </html>
