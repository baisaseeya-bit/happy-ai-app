<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <title>Happy AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { height: 100%; width: 100%; overflow: hidden; background-color: #0f111e; color: #fff; }
        body { display: flex; flex-direction: column; }
        
        /* Gold & Rainbow Luxury Header */
        .app-header {
            background: linear-gradient(135deg, #FFD700 0%, #FF8C00 25%, #FF007F 50%, #7B2CBF 75%, #00F5D4 100%);
            color: #fff; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.3); border-bottom: 2px solid #FFD700; flex-shrink: 0;
        }
        .app-title { font-size: 20px; font-weight: 900; display: flex; align-items: center; gap: 8px; }
        .vip-badge {
            background: #FFD700; color: #000; font-size: 10px; padding: 3px 8px;
            border-radius: 12px; font-weight: 900; text-transform: uppercase; box-shadow: 0 0 8px #FFD700;
        }
        .upgrade-btn {
            background: linear-gradient(45deg, #FFD700, #FFA500); color: #000; border: none; padding: 8px 14px;
            border-radius: 20px; font-size: 12px; font-weight: 800; cursor: pointer;
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4);
        }

        /* Chat Area */
        .chat-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; background: #14172b; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 14px; line-height: 1.4; }
        .ai-msg {
            background: #1e233d; color: #f1f2f6; align-self: flex-start; border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 215, 0, 0.2);
        }
        .user-msg {
            background: linear-gradient(135deg, #FF007F, #7B2CBF); color: #fff; align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        
        /* Attachment Menu */
        .attachment-menu {
            display: none; background: #1e233d; border: 1px solid #FFD700; padding: 12px; border-radius: 18px;
            position: absolute; bottom: 70px; left: 15px; box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            flex-direction: column; gap: 10px; z-index: 10;
        }
        .menu-item {
            display: flex; align-items: center; gap: 10px; padding: 10px 15px;
            border: none; background: #2a3052; color: #fff; font-size: 13px; cursor: pointer; border-radius: 10px; font-weight: 600;
        }

        /* Fixed Input Bar */
        .input-bar {
            background: #1e233d; padding: 10px 12px; display: flex; align-items: center;
            gap: 8px; box-shadow: 0 -4px 15px rgba(0,0,0,0.4); position: relative; border-top: 1px solid rgba(255, 215, 0, 0.3);
            flex-shrink: 0; padding-bottom: max(10px, env(safe-area-inset-bottom));
        }
        .btn-icon { background: none; border: none; font-size: 20px; cursor: pointer; color: #FFD700; padding: 4px; display: flex; align-items: center; }
        .input-box {
            flex: 1; border: 1px solid rgba(255,215,0,0.4); padding: 10px 14px; border-radius: 20px;
            outline: none; font-size: 14px; background: #0f111e; color: #fff;
        }
        .btn-send {
            background: linear-gradient(45deg, #FFD700, #FF8C00); color: #000; border: none; min-width: 40px; height: 40px;
            border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.4); flex-shrink: 0;
        }

        /* Gold Modal Popup */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #1e233d; border: 2px solid #FFD700; padding: 20px; border-radius: 20px;
            width: 88%; max-width: 340px; text-align: center; color: #fff;
        }
        .modal h3 { margin-bottom: 12px; color: #FFD700; font-size: 18px; }
        .plan-card {
            border: 1px solid #FFD700; padding: 10px; margin: 8px 0; border-radius: 10px;
            background: #2a3052; font-weight: bold; color: #FFD700; font-size: 14px;
        }
        .vip-input {
            width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #FFD700; border-radius: 10px;
            text-align: center; background: #0f111e; color: #FFD700; font-size: 15px; font-weight: bold;
        }
        .btn-close { background: #555; color: white; border: none; padding: 8px 18px; border-radius: 12px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-header">
        <div class="app-title">
            <span>Happy AI</span>
            <span class="vip-badge" id="vipStatus">FREE</span>
        </div>
        <button class="upgrade-btn" onclick="showModal()">👑 VIP / Upgrade</button>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="msg ai-msg">नमस्ते! मैं Happy AI हूँ। सतरंगी और गोल्ड थीम में आपका स्वागत है! ✨ आप रोज़ाना 3 फ्री फोटो बनवा सकते हैं! 🎨</div>
    </div>

    <div class="attachment-menu" id="plusMenu">
        <button class="menu-item" onclick="generatePhoto()">🖼️ Generate Photo (<span id="photoCount">3</span> Left Today)</button>
        <button class="menu-item" onclick="generateVideo()">🎬 Generate AI Video (VIP)</button>
        <button class="menu-item" onclick="alert('फाइल/फोटो चुनें')">📁 Upload File/Image</button>
    </div>

    <div class="input-bar">
        <button class="btn-icon" onclick="togglePlusMenu()">➕</button>
        <input type="text" class="input-box" id="userInput" placeholder="Ask Happy AI anything...">
        <button class="btn-icon" onclick="startVoice()">🎙️</button>
        <button class="btn-send" onclick="sendMsg()">➤</button>
    </div>

    <div class="modal" id="membershipModal">
        <div class="modal-content">
            <h3>👑 VIP & Membership</h3>
            <p style="font-size: 12px; color: #dcdde1; margin-bottom: 8px;">अनलिमिटेड एक्सेस के लिए प्लान चुनें या VIP Pass डालें:</p>
            
            <div class="plan-card">₹300 / Month</div>
            <div class="plan-card">₹500 / Month</div>
            <div class="plan-card">₹500 / 3 Months</div>

            <hr style="margin: 12px 0; border: 0.5px solid rgba(255,215,0,0.3);">

            <p style="font-size: 13px; font-weight: bold; color: #FFD700;">🔑 Enter VIP Pass Code:</p>
            <input type="password" id="vipCodeInput" class="vip-input" placeholder="Enter VIP Pass Code">
            <button class="upgrade-btn" style="width: 100%; font-size: 14px; padding: 10px;" onclick="activateVIP()">Activate VIP Pass</button>

            <button class="btn-close" onclick="closeModal()">Close</button>
        </div>
    </div>

    <script>
        let isVIP = false;
        let freePhotosLeft = 3;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        function togglePlusMenu() {
            const menu = document.getElementById('plusMenu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }

        function showModal() { document.getElementById('membershipModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('membershipModal').style.display = 'none'; }

        function activateVIP() {
            const code = document.getElementById('vipCodeInput').value.trim();
            if(code === '7777') {
                isVIP = true;
                document.getElementById('vipStatus').innerText = 'VIP PASS';
                document.getElementById('vipStatus').style.background = 'linear-gradient(45deg, #FFD700, #FF8C00)';
                alert('🎉 VIP Pass Activated Successfully!');
                closeModal();
            } else {
                alert('❌ Invalid VIP Code!');
            }
        }

        function sendMsg() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if(!text) return;

            appendMsg(text, 'user-msg');
            input.value = '';

            setTimeout(() => {
                appendMsg("Happy AI: आपके सवाल '" + text + "' का जवाब तैयार किया जा रहा है...", 'ai-msg');
            }, 800);
        }

        function appendMsg(text, className) {
            const chat = document.getElementById('chatArea');
            const div = document.createElement('div');
            div.className = 'msg ' + className;
            div.innerText = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function generatePhoto() {
            togglePlusMenu();
            if(isVIP) {
                appendMsg("🎨 Generating High Quality Photo (VIP Unlimited)...", 'ai-msg');
            } else if(freePhotosLeft > 0) {
                freePhotosLeft--;
                document.getElementById('photoCount').innerText = freePhotosLeft;
                appendMsg("🎨 Generating AI Photo... (Remaining Free Photos Today: " + freePhotosLeft + ")", 'ai-msg');
            } else {
                alert("⚠️ आज की 3 फ्री फोटो लिमिट खत्म हो गई है! VIP Pass या Upgrade यूज़ करें।");
                showModal();
            }
        }

        function generateVideo() {
            togglePlusMenu();
            if(!isVIP) {
                alert('⚠️ AI Video generation requires VIP Pass or Membership!');
                showModal();
            } else {
                appendMsg("🎬 Generating AI Video (VIP Access Granted)...", 'ai-msg');
            }
        }

        function startVoice() { alert('🎙️ Listening... बोलकर सवाल पूछें!'); }
    </script>
</body>
  </html>
