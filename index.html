<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Happy AI - PWA</title>
  <meta name="theme-color" content="#f59e0b" />
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #121826;
      --card-border: #1e293b;
      --primary: #f59e0b;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --ai-bubble: #172033;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--card-border); padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; z-index: 20; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.2rem; color: #fbbf24; }
    .avatar-icon { width: 36px; height: 36px; border-radius: 12px; background: linear-gradient(135deg, #f59e0b, #ea580c); display: flex; align-items: center; justify-content: center; font-size: 19px; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .btn { padding: 8px 14px; border-radius: 12px; border: 1px solid var(--card-border); background: var(--card-bg); color: var(--text); font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover { background: #1e293b; }
    .btn-vip { background: rgba(245, 158, 11, 0.15); border-color: rgba(245, 158, 11, 0.4); color: #fcd34d; }
    .btn-vip.unlocked { background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; font-weight: 800; border: none; }
    .lang-select { background: var(--card-bg); color: var(--text); border: 1px solid var(--card-border); padding: 8px 12px; border-radius: 12px; font-size: 0.82rem; cursor: pointer; outline: none; }
    .chat-container { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
    .welcome-hero { text-align: center; margin: 20px auto 10px; max-width: 500px; padding: 20px; border-radius: 24px; background: radial-gradient(circle at top, rgba(245, 158, 11, 0.12), transparent 70%); }
    .welcome-hero h2 { font-size: 1.5rem; margin-bottom: 6px; }
    .welcome-hero p { font-size: 0.88rem; color: var(--text-muted); line-height: 1.5; }
    .suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; }
    .chip { background: #172033; border: 1px solid #1e293b; padding: 6px 14px; border-radius: 20px; font-size: 0.78rem; cursor: pointer; color: #cbd5e1; }
    .chip:hover { border-color: var(--primary); color: #fff; transform: translateY(-1px); }
    .msg-row { display: flex; align-items: flex-start; gap: 10px; width: 100%; animation: fadeIn 0.3s ease; }
    .msg-row.user { justify-content: flex-end; }
    .msg-avatar { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg, #f59e0b, #f97316); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .msg-bubble { max-width: 78%; padding: 12px 16px; border-radius: 20px; font-size: 0.92rem; line-height: 1.55; }
    .msg-row.ai .msg-bubble { background: var(--ai-bubble); border: 1px solid #1e293b; color: #f8fafc; border-top-left-radius: 4px; }
    .msg-row.user .msg-bubble { background: linear-gradient(135deg, #f59e0b, #ea580c); color: #000; font-weight: 500; border-top-right-radius: 4px; }
    .vip-tag { font-size: 0.65rem; font-weight: 800; color: #f59e0b; margin-bottom: 4px; text-transform: uppercase; }
    footer { padding: 12px 16px; background: rgba(15, 23, 42, 0.95); border-top: 1px solid var(--card-border); }
    .input-wrapper { max-width: 800px; margin: 0 auto; display: flex; align-items: center; gap: 8px; background: #121826; border: 1px solid #243048; border-radius: 24px; padding: 6px 10px; }
    .chat-input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 0.95rem; padding: 8px 12px; }
    .btn-circle { width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
    .btn-mic { background: #1e293b; color: #cbd5e1; }
    .btn-mic.listening { background: #ef4444; color: #fff; animation: pulse 1s infinite; }
    .btn-send { background: linear-gradient(135deg, #f59e0b, #ea580c); color: #000; font-weight: bold; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal-card { background: #111827; border: 1px solid #374151; border-radius: 24px; max-width: 360px; width: 100%; padding: 24px; text-align: center; position: relative; }
    .close-btn { position: absolute; top: 14px; right: 14px; background: transparent; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; }
    .pin-dots { display: flex; justify-content: center; gap: 14px; margin: 20px 0; }
    .dot { width: 18px; height: 18px; border-radius: 50%; background: #1f2937; border: 2px solid #374151; transition: all 0.2s; }
    .dot.filled { background: #f59e0b; border-color: #fbbf24; transform: scale(1.15); box-shadow: 0 0 10px rgba(245, 158, 11, 0.6); }
    .dot.error { background: #ef4444; border-color: #f87171; }
    .dot.success { background: #10b981; border-color: #34d399; }
    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 260px; margin: 0 auto; }
    .key-btn { padding: 14px 0; border-radius: 14px; background: #1f2937; border: 1px solid #374151; color: #fff; font-size: 1.2rem; font-weight: 700; cursor: pointer; }
    .key-btn:active { background: #374151; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="avatar-icon">😊</div>
      <span>Happy AI</span>
    </div>
    <div class="header-actions">
      <button id="vipBtn" class="btn btn-vip" onclick="openVipModal()">
        <span>👑</span><span id="vipBtnText">VIP 7777</span>
      </button>
      <select id="langSelect" class="lang-select" onchange="changeLanguage(this.value)">
        <option value="hi">🇮🇳 हिंदी (Hindi)</option>
        <option value="en" selected>🌐 English</option>
        <option value="mr">🚩 मराठी (Marathi)</option>
        <option value="ta">🪔 தமிழ் (Tamil)</option>
      </select>
    </div>
  </header>

  <div class="chat-container" id="chatContainer">
    <div class="welcome-hero">
      <div style="font-size: 40px; margin-bottom: 8px;">✨😊✨</div>
      <h2 id="welcomeTitle">Hello! I am Happy AI</h2>
      <p id="welcomeDesc">Your joyful assistant with voice input, multi-language support, and VIP 7777 mode.</p>
      <div class="suggestions" id="suggestionsContainer"></div>
    </div>
  </div>

  <footer>
    <div class="input-wrapper">
      <button id="micBtn" class="btn-circle btn-mic" onclick="toggleVoiceInput()" title="Voice Input">🎤</button>
      <input type="text" id="userInput" class="chat-input" placeholder="Type your message... (or tap mic)" onkeypress="if(event.key==='Enter') sendMessage()" />
      <button class="btn-circle btn-send" onclick="sendMessage()" title="Send">➤</button>
    </div>
  </footer>

  <!-- VIP Passcode Modal -->
  <div id="vipModal" class="modal-overlay">
    <div class="modal-card" id="vipCard">
      <button class="close-btn" onclick="closeVipModal()">✕</button>
      <div style="font-size: 32px; margin-bottom: 6px;">👑</div>
      <h3 style="color:#fcd34d;">VIP Passcode</h3>
      <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 4px;">Enter the 4-digit masked passcode (7777)</p>
      <div class="pin-dots">
        <div class="dot" id="dot0"></div>
        <div class="dot" id="dot1"></div>
        <div class="dot" id="dot2"></div>
        <div class="dot" id="dot3"></div>
      </div>
      <div class="keypad">
        <button class="key-btn" onclick="enterDigit('1')">1</button>
        <button class="key-btn" onclick="enterDigit('2')">2</button>
        <button class="key-btn" onclick="enterDigit('3')">3</button>
        <button class="key-btn" onclick="enterDigit('4')">4</button>
        <button class="key-btn" onclick="enterDigit('5')">5</button>
        <button class="key-btn" onclick="enterDigit('6')">6</button>
        <button class="key-btn" onclick="enterDigit('7')">7</button>
        <button class="key-btn" onclick="enterDigit('8')">8</button>
        <button class="key-btn" onclick="enterDigit('9')">9</button>
        <button class="key-btn" onclick="clearPin()" style="font-size:0.8rem;">C</button>
        <button class="key-btn" onclick="enterDigit('0')">0</button>
        <button class="key-btn" onclick="deleteDigit()">⌫</button>
      </div>
    </div>
  </div>

  <script>
    let currentLang = 'en', isVip = false, pin = '', isListening = false, recognition = null;
    const CORRECT_PASSCODE = '7777';

    const I18N = {
      en: { welcomeTitle: 'Hello! I am Happy AI 😊', welcomeDesc: 'Your joyful assistant with voice input & VIP 7777.', placeholder: 'Type your message... (or tap mic)', speechLocale: 'en-US', suggestions: ['Inspire me today 🌟', '3 tips for daily happiness 🧘', 'How does AI work? 💡'] },
      hi: { welcomeTitle: 'नमस्ते! मैं हूँ Happy AI 😊', welcomeDesc: 'आपका आनंदमय एआई साथी। वॉइस इनपुट और VIP 7777 उपलब्ध है।', placeholder: 'यहाँ संदेश लिखें... (या माइक दबाएँ)', speechLocale: 'hi-IN', suggestions: ['आज का सुविचार 🌟', 'खुश रहने के ३ तरीके 🧘', 'ज्ञानवर्धक कहानी 📖'] },
      mr: { welcomeTitle: 'नमस्कार! मी आहे Happy AI 😊', welcomeDesc: 'तुमचा आनंदी एआई मित्र। व्हॉइस इनपुट आणि VIP 7777 उपलब्ध.', placeholder: 'येथे संदेश लिहा... (किंवा माइक दाबा)', speechLocale: 'mr-IN', suggestions: ['आजचा सुविचार 🌟', 'तणावमुक्त राहण्याचे उपाय 🧘', 'सुंदर बोधकथा 📖'] },
      ta: { welcomeTitle: 'வணக்கம்! நான் Happy AI 😊', welcomeDesc: 'உங்கள் மகிழ்ச்சியான ஏஐ தோழன். குரல் உள்ளீடு மற்றும் VIP 7777 வசதி.', placeholder: 'உங்கள் செய்தியை உள்ளிடவும்...', speechLocale: 'ta-IN', suggestions: ['இன்றைய பொன்மொழி 🌟', 'மகிழ்ச்சியாக இருக்க வழிகள் 🧘', 'சிறுகதை கூறுங்கள் 📖'] }
    };

    function changeLanguage(lang) {
      currentLang = lang;
      const d = I18N[lang];
      document.getElementById('welcomeTitle').innerText = d.welcomeTitle;
      document.getElementById('welcomeDesc').innerText = d.welcomeDesc;
      document.getElementById('userInput').placeholder = d.placeholder;
      const c = document.getElementById('suggestionsContainer');
      c.innerHTML = '';
      d.suggestions.forEach(s => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.innerText = s;
        chip.onclick = () => { document.getElementById('userInput').value = s; sendMessage(); };
        c.appendChild(chip);
      });
    }
    changeLanguage('en');

    function openVipModal() { document.getElementById('vipModal').classList.add('open'); pin = ''; updateDots(); }
    function closeVipModal() { document.getElementById('vipModal').classList.remove('open'); }

    function updateDots(status = '') {
      for (let i = 0; i < 4; i++) {
        const d = document.getElementById('dot' + i);
        d.className = 'dot' + (status ? ' ' + status : '') + (i < pin.length ? ' filled' : '');
      }
    }

    function enterDigit(d) {
      if (pin.length < 4) {
        pin += d;
        updateDots();
        if (pin.length === 4) {
          if (pin === CORRECT_PASSCODE) {
            updateDots('success');
            setTimeout(() => {
              isVip = true;
              document.getElementById('vipBtn').classList.add('unlocked');
              document.getElementById('vipBtnText').innerText = 'VIP 7777 ACTIVE';
              closeVipModal();
              appendMessage('ai', '🌟 **VIP 7777 Mode Activated!** Supreme access granted!');
            }, 400);
          } else {
            updateDots('error');
            setTimeout(() => { pin = ''; updateDots(); }, 500);
          }
        }
      }
    }
    function deleteDigit() { pin = pin.slice(0, -1); updateDots(); }
    function clearPin() { pin = ''; updateDots(); }

    function toggleVoiceInput() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return alert('Speech recognition not supported in this browser.');
      const btn = document.getElementById('micBtn');
      if (isListening && recognition) { recognition.stop(); return; }
      recognition = new SR();
      recognition.lang = I18N[currentLang].speechLocale;
      recognition.onstart = () => { isListening = true; btn.classList.add('listening'); };
      recognition.onresult = (e) => { document.getElementById('userInput').value = e.results[0][0].transcript; };
      recognition.onend = () => { isListening = false; btn.classList.remove('listening'); };
      recognition.start();
    }

    function appendMessage(sender, text) {
      const c = document.getElementById('chatContainer');
      const row = document.createElement('div');
      row.className = 'msg-row ' + sender;
      let html = sender === 'ai' ? '<div class="msg-avatar">' + (isVip ? '👑' : '😊') + '</div>' : '';
      html += '<div class="msg-bubble">';
      if (sender === 'ai' && isVip) html += '<div class="vip-tag">👑 VIP 7777</div>';
      html += text.replace(/\\*\\*(.*?)\\*\\*/g, '<strong>$1</strong>');
      html += '</div>';
      row.innerHTML = html;
      c.appendChild(row);
      c.scrollTop = c.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;
      appendMessage('user', text);
      input.value = '';
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, language: currentLang, isVip })
        });
        if (res.ok) {
          const data = await res.json();
          appendMessage('ai', data.reply);
          return;
        }
      } catch (e) {}
      appendMessage('ai', '😊 ' + text + (isVip ? ' [VIP 7777 Mode Active]' : ''));
    }
  </script>
</body>
  </html>
